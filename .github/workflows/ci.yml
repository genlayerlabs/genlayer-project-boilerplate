name: CI

on:
  # Run CI on development branches too. The branch-policy workflow retargets
  # PRs away from main to the active development branch (currently v2-dev), so
  # filtering these events to main would leave the normal contribution path
  # without lint or direct-test checks.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-contracts:
    name: Lint Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/football_bets.py

  test-direct:
    name: Direct Mode Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/direct/ -v
